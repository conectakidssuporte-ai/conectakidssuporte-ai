# Gera os cartões do perfil uma vez por dia e guarda as imagens neste repositório,
# para elas não dependerem de serviço externo na hora de abrir o perfil.
name: Cartões do perfil

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 6h17 em Fortaleza
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cartoes.yml']

permissions:
  contents: write

concurrency:
  group: cartoes
  cancel-in-progress: true

jobs:
  cartoes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -3

  cobrinha:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg
            dist/cobrinha-escura.svg?palette=github-dark

      # as imagens ficam no ramo "output", separado do main, para não encher o histórico
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Atualiza a cobrinha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
